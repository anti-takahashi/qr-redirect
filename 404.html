<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e7">
<meta name="robots" content="noindex, nofollow">
<title>アンティーク家具たかはし</title>
<link rel="icon" href="data:,">
<!--
  ===========================================================================
  見つからないURLの受け皿。**GitHub Pages 専用**。
  （自社ECの /docs/catalog/ へFTPで上げても使われない。あちらの404はECサーバの設定側）

  🔴 なぜ要るか
     置かないと、qr.antiquekagu-takahashi.com/なにか が **GitHubの英語の404ページ**になる。
     当社のドメインなのに当社と無関係な画面が出るうえ、次に何をすればよいかが出ない。
     ラベルを貼った現物の前で客が見る可能性がある画面を、行き止まりにしない。

  🔴 兼ねている役割 ── パス形式 `/<32桁16進>` の受け
     旧・中継ページ（qr-redirect/index.html）は `?t=` に加えてパス形式にも対応していた
     （「将来URLを短くしたくなったとき用」）。GitHub Pages にはその名前のファイルが無いので
     ここへ落ちてくる。**ここで `/?t=<トークン>` へ入れ直す**＝旧中継の対応範囲を落とさない。
     ⚠️ 実際に印刷されたラベルは全て `?t=` 形式（パス形式のラベルは1枚も無い）。
        これは保険であって、常用の経路ではない。
  🔴 配色は4面統一（2026-08-11決定・正本= four-surface-design-handoff/HANDOFF.md）。
     index.html と同じ値を直書きしている（このページは単独で開くのでCSS変数を借りられない）。
  ===========================================================================
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Mincho ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", serif;
    background: #f7f1e7; color: #2b2926; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 20px; line-height: 1.9;
  }
  .wrap { width: 100%; max-width: 420px; text-align: center; }
  .t { font-size: 19px; font-weight: 600; margin-bottom: 12px; }
  .s { font-size: 15px; color: #665e54; margin-bottom: 26px; }
  .b {
    display: block; width: 100%; min-height: 56px; line-height: 56px;
    background: #83937d; color: #fff; border-radius: 12px;
    text-decoration: none; font-size: 17px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="t" id="t">商品が特定できませんでした</p>
    <p class="s" id="s">QRコードをもう一度読み取ってみてください。<br>
      うまくいかないときは、店頭スタッフにお声がけください。</p>
    <a class="b" href="/">カタログの入口へ</a>
  </div>
<script>
(function () {
  // パス形式 /<32桁16進> で来たものだけ、単品ページへ入れ直す。
  // 🔴 形が違うものは**素通ししない**（変な値をそのままURLに載せない）。
  var m = String(window.location.pathname || '').match(/\/([0-9a-fA-F]{32})\/?$/);
  if (m) {
    var url = '/?t=' + m[1].toLowerCase();
    document.getElementById('t').textContent = '商品ページをひらいています';
    document.getElementById('s').innerHTML = '切り替わらない場合は、下のボタンをタップしてください。';
    var b = document.querySelector('.b');
    b.href = url;                       // 先にリンクを入れる（自動遷移が止まっても押せる）
    b.textContent = 'つづける';
    try { window.location.replace(url); } catch (e) { /* ボタンで進んでもらう */ }
  }
})();
</script>
</body>
</html>
