<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>商品管理｜アンティーク家具たかはし</title>

<!-- 🔴【2026-08-01】ここは**自社ドメイン**なので、外側の <head> が自分のものになる。
     GASのWebアプリだと外側はGoogleのもので、
       ・ホーム画面のアイコンと名前が届かない（「ア」になる）
       ・Googleの注意表示が出る
       ・複数アカウントで /macros/u/1/s/… へ書き換わって404
     が全部起きていた。ここへ移すとその一群が構造ごと消える。 -->
<link rel="apple-touch-icon" href="../icon-admin-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-admin-192.png">
<meta name="apple-mobile-web-app-title" content="商品管理">
<meta name="application-name" content="商品管理">
<meta name="theme-color" content="#faf7f2">
<meta name="robots" content="noindex, nofollow">
<!-- 🔴 manifest は付けない。付けるとiOSが**web appとして起動**し、
     ①開くURLが start_url に置き換わる ②localStorage が Safari と別領域になる。
     2026-07-31に実機で踏んだ（ホーム画面から開くと鍵が見えない）。
     アイコンと名前は上の apple-touch-icon / apple-mobile-web-app-title で足りる。 -->

<style>
  :root {
    --bg: #faf7f2; --fg: #2f2b26; --accent: #7c6a4f;
    --muted: #6b6255; --line: #e3dcd0; --card: #fff;
    --ok: #2f7a4d; --danger: #c0392b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.75 "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* 上の帯: いつでも「いまどこか」と「戻る」が見える */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
    /* 🔴【2026-08-01】ここは書き間違えていた。4つ書く順は上・右・下・左なので、
       もとの `10px 14px calc(10px + env(safe-area-inset-top)) 14px` は
       **切り欠きぶんを「下」に足していた**（実機で最大30px以上の無駄な余白）。
       欲しいのは上。1行で書くと間違えるので、上下左右を分けて書く。 */
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px 14px;
  }
  #back {
    display: none; align-items: center; justify-content: center;
    min-width: 44px; min-height: 44px; margin-left: -8px;
    border: 0; background: transparent; color: var(--fg);
    font-size: 22px; cursor: pointer;
  }
  #here { font-size: 17px; font-weight: 700; flex: 1; }
  #who { font-size: 12px; color: var(--muted); white-space: nowrap; }

  main { padding: 14px; max-width: 720px; margin: 0 auto; }

  /* 🔴 画面は「切り替える」だけ。移動しない＝白い画面を挟まない */
  .view { display: none; }
  .view.on { display: block; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin-bottom: 12px;
  }
  h2 { font-size: 16px; margin: 0 0 8px; }
  p { margin: 0 0 10px; }
  .sub { font-size: 13px; color: var(--muted); }

  /* 🔴 タップ先は48px以上（店頭で立って・急いで押す） */
  .btn {
    display: flex; align-items: center; gap: 12px; width: 100%;
    min-height: 60px; padding: 12px 16px; margin-bottom: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    font: inherit; font-weight: 700; color: var(--fg); text-align: left; cursor: pointer;
  }
  .btn:active { background: #f2ece2; }
  .btn .t { flex: 1; }
  .btn .d { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
  /* 🔴【2026-08-01・実機で発覚】もとは .btn.primary .t を flex:0 にしていた。
     .btn は横並び(flex)なので、子の幅が文字1つぶんまで潰れ、
     「はいる」が **は／い／る の3行**になって縦に伸びていた（実機スクショで確認）。
     中央に置きたいだけなので、幅を潰さず text-align で寄せる。 */
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary .t { flex: 1; text-align: center; }

  input[type="tel"], input[type="text"], input[type="number"] {
    width: 100%; min-height: 52px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 12px;
    font: inherit; background: #fff; color: var(--fg);
  }
  label.f { display: block; margin-bottom: 12px; }
  label.f > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }

  .msg { font-size: 14px; margin-top: 10px; min-height: 1.6em; }
  .msg.err { color: var(--danger); font-weight: 700; }
  .msg.ok { color: var(--ok); font-weight: 700; }

  /* 通信中は「止まっている」と見えないようにする */
  #busy {
    position: fixed; left: 0; right: 0; top: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 40% 100%; background-repeat: no-repeat;
    animation: slide 1.1s linear infinite; display: none; z-index: 20;
  }
  @keyframes slide { from { background-position: -40% 0; } to { background-position: 140% 0; } }
</style>
</head>
<body>
<div id="busy"></div>

<header>
  <button id="back" type="button" aria-label="ひとつ戻る">←</button>
  <div id="here">商品管理</div>
  <div id="who"></div>
</header>

<main>
  <!-- ① 鍵がない（この端末はまだ登録されていない） -->
  <section class="view" id="v-nokey">
    <div class="card">
      <h2>この端末はまだ登録されていません</h2>
      <p>オーナーから渡された<b>アクセスキーQR</b>を、この端末のカメラで読み取ってください。</p>
      <p class="sub">読み取ったあとの画面から、そのままホーム画面に追加してください。次からはアイコンだけで入れます。</p>
    </div>
  </section>

  <!-- ② PIN -->
  <section class="view" id="v-pin">
    <div class="card">
      <h2 id="pin-title">PINを入れてください</h2>
      <label class="f">
        <span>数字だけ</span>
        <input type="tel" id="pin" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]*" maxlength="12" placeholder="••••">
      </label>
      <button class="btn primary" id="pin-go" type="button"><span class="t">はいる</span></button>
      <div class="msg" id="pin-msg"></div>
    </div>
  </section>

  <!-- ③ ホーム（何をするか選ぶ） -->
  <section class="view" id="v-home">
    <button class="btn" data-go="quickreg">
      <span class="t">QRを貼って登録する<span class="d">棚の前で、ラベルを貼って写真を撮る</span></span>
    </button>
    <button class="btn" data-go="sale">
      <span class="t">売上を入れる<span class="d">レジで売れたものを記録する</span></span>
    </button>
    <button class="btn" data-go="search">
      <span class="t">QRで探す・直す<span class="d">値段や補足を書き足す</span></span>
    </button>
    <button class="btn" data-go="pricing">
      <span class="t">未値付けに値段をつける<span class="d">まだ値段の無いものを続けて</span></span>
    </button>
    <button class="btn" data-go="list">
      <span class="t">商品一覧<span class="d">眺めて、ねだんやネット候補を入れる</span></span>
    </button>
    <!-- 🔴 管理モードはオーナーだけ。ここを隠すのは**見やすさのため**であって、
         守っているのはサーバ側（requireAdmin_ が代表・手伝いを拒否する）。
         画面から消すことを対策と呼ばない（CLAUDE.md「絞り込みはサーバ側で行う」）。 -->
    <div id="home-admin" style="display:none;">
      <div class="sub" style="margin:18px 0 8px;">オーナーのみ</div>
      <button class="btn" data-go="edit">
        <span class="t">QRで探して直す（詳しく）<span class="d">商品名・カテゴリ・説明まで直す</span></span>
      </button>
      <button class="btn" data-go="netlist">
        <span class="t">QRからネット出品<span class="d">出せるか確かめて、出品リストへ送る</span></span>
      </button>
      <!-- 🔴【2026-08-01・Codex監査6】管理モードは3つ（CLAUDE.md）だが2つしか無かった。
           ⚠️ ここは**見るだけ**にする。出す／出さないの判断はPC版が持つ
              （判断の位は owner_pc が最上位。スマホから決めると位が下の書込みになる）。 -->
      <button class="btn" data-go="queue">
        <span class="t">出品リスト<span class="d">いま送ってある品を見る（決めるのはPC版）</span></span>
      </button>
    </div>

    <div class="card sub" style="margin-top:14px;">
      いまはまだ作っている途中です。<b>これまでの管理ページもそのまま使えます。</b>
    </div>
  </section>

  <!-- ④ 各画面（中身はこれから足す） -->
  <!-- 🔴 ふだんは通らない画面。裏で用意が済んでいれば、押した瞬間に /quickreg/ へ飛ぶ。
       ここが出るのは「用意が間に合わなかった」「取れなかった」時だけ＝
       何が起きているかを見せるための画面。行き止まりにしない。 -->
  <section class="view" id="v-quickreg">
    <div class="card">
      <h2>QRを貼って登録する</h2>
      <div class="msg" id="qr-msg">準備しています…</div>
      <button class="btn primary" id="qr-retry" type="button" style="margin-top:12px;">
        <span class="t">もう一度ためす</span>
      </button>
    </div>
  </section>
  <!-- 売上を入れる: QRを続けて読んで「かご」に貯め、まとめて会計する -->
  <section class="view" id="v-sale">
    <div class="card">
      <label class="f">
        <span>QRを読むか、商品ID（T-00123）を入れる</span>
        <input type="text" id="sale-input" inputmode="text" autocomplete="off"
               autocapitalize="off" spellcheck="false" placeholder="T-00123">
      </label>
      <button class="btn primary" id="sale-add" type="button"><span class="t">かごに入れる</span></button>
      <div class="msg" id="sale-msg"></div>
    </div>

    <div class="card" id="sale-cart-card" style="display:none;">
      <h2>かご <span id="sale-count" class="sub"></span></h2>
      <div id="sale-cart"></div>
      <div style="border-top:1px solid var(--line); margin-top:10px; padding-top:10px;">
        <label class="f">
          <span>値引き（要らなければ空のまま）</span>
          <div style="display:flex; gap:8px;">
            <input type="number" id="sale-disc" inputmode="numeric" min="0" placeholder="0" style="flex:1;">
            <select id="sale-disc-type" class="input" style="width:38%; min-height:52px;">
              <option value="yen">円びき</option>
              <option value="pct">％びき</option>
            </select>
          </div>
        </label>
        <div id="sale-total" style="font-size:19px; font-weight:700; margin:6px 0 12px;"></div>
        <button class="btn primary" id="sale-go" type="button"><span class="t">この内容で会計する</span></button>
        <div class="msg" id="sale-result"></div>
      </div>
    </div>

    <div class="card">
      <h2>今日売れたもの</h2>
      <div id="sale-today" class="sub">読み込んでいます…</div>
    </div>
  </section>
  <!-- QRで探す・直す: QR/IDから1点を開いて、ねだんと補足を書き足す
       🔴 searchProducts は使わない（店舗の人は使えない口。原価が乗る全列を返すため）。
          QR・IDの解決 → その1点だけ、が店舗モードの道。 -->
  <section class="view" id="v-search">
    <div class="card">
      <label class="f">
        <span>QRを読むか、商品ID（T-00123）を入れる</span>
        <input type="text" id="sch-input" inputmode="text" autocomplete="off"
               autocapitalize="off" spellcheck="false" placeholder="T-00123">
      </label>
      <button class="btn primary" id="sch-go" type="button"><span class="t">開く</span></button>
      <div class="msg" id="sch-msg"></div>
    </div>
    <div id="sch-detail"></div>
  </section>

  <!-- 未値付けに値段をつける: 値段の無いものを続けて片付ける -->
  <section class="view" id="v-pricing">
    <div class="card">
      <h2>値段のないもの <span id="pri-count" class="sub"></span></h2>
      <div class="msg" id="pri-msg">読み込んでいます…</div>
    </div>
    <div id="pri-list"></div>
  </section>

  <!-- 商品一覧: 眺めて気づいたことを入れる（ねだん・ネット候補） -->
  <section class="view" id="v-list">
    <div class="card">
      <label class="f">
        <span>さがす言葉（空のままなら全部）</span>
        <input type="text" id="lst-q" autocomplete="off" placeholder="鉄瓶 など">
      </label>
      <button class="btn primary" id="lst-go" type="button"><span class="t">さがす</span></button>
      <div class="msg" id="lst-msg"></div>
    </div>
    <div id="lst-list"></div>
    <button class="btn" id="lst-more" type="button" style="display:none;">
      <span class="t">もっと見る</span>
    </button>
  </section>

  <!-- ===== ここから管理モード（オーナーのみ） ===== -->

  <!-- QRで探して直す（詳しく）: 店舗モードの「補足だけ」に対して、こちらは列を広く直せる -->
  <section class="view" id="v-edit">
    <div class="card">
      <label class="f">
        <span>QRを読むか、商品ID（T-00123）を入れる</span>
        <input type="text" id="edt-input" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="T-00123">
      </label>
      <button class="btn primary" id="edt-go" type="button"><span class="t">開く</span></button>
      <div class="msg" id="edt-msg"></div>
    </div>
    <div id="edt-detail"></div>
  </section>

  <!-- QRからネット出品: 出せるか確かめて、出品リストへ送る -->
  <section class="view" id="v-netlist">
    <div class="card">
      <label class="f">
        <span>QRを読むか、商品ID（T-00123）を入れる</span>
        <input type="text" id="net-input" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="T-00123">
      </label>
      <button class="btn primary" id="net-go" type="button"><span class="t">確かめる</span></button>
      <div class="msg" id="net-msg"></div>
    </div>
    <div id="net-detail"></div>
  </section>

  <!-- ⑥ 出品リスト（見るだけ） -->
  <section class="view" id="v-queue">
    <div class="msg" id="q-msg">読み込んでいます…</div>
    <div id="q-list"></div>
  </section>
</main>

<script>
(function () {
  "use strict";

  // ==========================================================================
  // 商品管理（C構成の骨組み）— 2026-08-01
  //
  // 何が今までと違うか:
  //   ・ここは**自社ドメイン**。GASは画面を持たず、JSONを返すだけ。
  //   ・画面は**切り替えるだけ**（移動しない）＝白い画面もGoogleの注意表示も出ない。
  //   ・端末の記憶とURLの両方から鍵を拾う（ホーム画面から開いた時も入れるように）。
  //
  // 🔴 なぜ素の fetch で足りるのか（2026-08-01 実測）
  //   GASの `doPost`（ContentService）は **Access-Control-Allow-Origin: * を返す**。
  //   `doGet`（HTMLのページ）には付かないので、そちらを測って
  //   「CORSは通らない」と誤断していた。かんたんQR登録（/quickreg/）は
  //   ずっと前からこの形で動いている＝**発明ではなく踏襲**。
  // ==========================================================================

  var API = "";              // GASの /exec。鍵と一緒に受け取って覚える
  var KEY = "";              // アクセスキー（人ごと・刷り直せる）
  var SESSION = "";          // GASが返す adminSession（役割はサーバが毎回引き直す）
  var WHO = "";

  var K_KEY = "takahashi-kanri-key";
  var K_API = "takahashi-kanri-api";
  var K_SES = "takahashi-kanri-session";

  function $(id) { return document.getElementById(id); }
  function qs(n) {
    var m = new RegExp("[?&]" + n + "=([^&]*)").exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
  }
  function get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 覚えられなくても今回は動く */ } }

  // ---- 画面（移動しない） --------------------------------------------------
  var TITLE = {
    "nokey": "商品管理", "pin": "商品管理", "home": "商品管理",
    "quickreg": "QRを貼って登録する", "sale": "売上を入れる",
    "search": "QRで探す・直す", "pricing": "値段をつける"
  };
  var stack = [];
  function show(name, push) {
    var v = $("v-" + name);
    if (!v) return;
    var all = document.querySelectorAll(".view");
    for (var i = 0; i < all.length; i++) all[i].classList.remove("on");
    v.classList.add("on");
    $("here").textContent = TITLE[name] || "商品管理";
    if (push !== false) stack.push(name);
    // 🔴 戻るは「ホームより上」でだけ出す。最下層で出すと押しても何も起きず、壊れて見える。
    $("back").style.display = (stack.length > 1 && name !== "pin" && name !== "nokey") ? "flex" : "none";
    window.scrollTo(0, 0);
  }
  $("back").addEventListener("click", function () {
    if (stack.length <= 1) return;
    stack.pop();
    show(stack[stack.length - 1], false);
  });

  // 🔴 端末の戻る（ジェスチャー）も同じ道を通す。
  //    履歴を1段積んでおき、popstate で1段戻す。最下層では**離脱させない**
  //    （入力の途中で外へ出ると、書いたものが消える）。
  //    URLは変えない＝ホーム画面に焼かれたURL（鍵つき）を壊さない。
  var navSuppress = false;
  function pushHistory() {
    if (navSuppress) return;
    try { history.pushState({ kanri: stack.length }, ""); } catch (e) { /* 履歴が無い環境 */ }
  }
  window.addEventListener("popstate", function () {
    if (stack.length <= 1) { pushHistory(); return; }
    navSuppress = true;
    stack.pop();
    show(stack[stack.length - 1], false);
    navSuppress = false;
    pushHistory();
  });

  function go(name) { show(name); pushHistory(); }

  // 画面を開いたときに読むもの。**ここ1か所に集める**。
  // 🔴 PC版で「画面ごとに読み込みを書いていたら、5画面ぶん無言で切れていた」という
  //    実害が2026-07-31にあった（左メニューを束ねたとき配線が消えたのに誰も鳴らなかった）。
  //    出す場所と読む場所を1か所で対にしておけば、足し忘れが見つけやすい。
  var ONSHOW = {};

  var btns = document.querySelectorAll("[data-go]");
  for (var i = 0; i < btns.length; i++) {
    (function (b) {
      b.addEventListener("click", function () {
        var name = b.getAttribute("data-go");
        // 🔴 QR登録だけは**画面を出さずに飛ぶ**（用意が済んでいれば1タップ）。
        //    間に合っていないときだけ画面を出して、何が起きているかを見せる。
        if (name === "quickreg") { openQuickReg(); return; }
        go(name);
        // 開いたときに読む処理（画面ごと）。
        // 🔴 ここを**画面を出す1か所**にまとめる。あちこちで読むと、
        //    「開いたのに読み込みが走らない」画面が黙って増える（PC版で実際に起きた）。
        if (ONSHOW[name]) { try { ONSHOW[name](); } catch (e) { /* 表示は既に出ている */ } }
      });
    })(btns[i]);
  }

  // ---- 通信 ----------------------------------------------------------------
  var busyCount = 0;
  function busy(on) {
    busyCount += on ? 1 : -1;
    if (busyCount < 0) busyCount = 0;
    $("busy").style.display = busyCount > 0 ? "block" : "none";
  }

  /// GASを呼ぶ。**text/plain で投げる**のが要点（preflightが起きない＝OPTIONSは405で落ちる）。
  /// 🔴 応答は必ず ok を見る。エラーを握りつぶすと「失敗が成功に見える」。
  function call(action, data) {
    if (!API) return Promise.reject(new Error("接続先が分かりません。アクセスキーQRを読み直してください。"));
    var body = { action: action, data: Object.assign({}, data || {}) };
    if (SESSION) body.data.adminSession = SESSION;
    busy(true);
    return fetch(API, {
      method: "POST", mode: "cors", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error("つながりませんでした（" + r.status + "）");
      return r.json();
    }).then(function (res) {
      if (!res || !res.ok) {
        throw new Error(String((res && res.error) || "不明なエラー").replace(/^Error:\s*/, ""));
      }
      // 🔴【2026-08-01・カタログ側の同型不具合から横展開】okが**2枚ある**。
      //   外側は「doPostが処理を呼べた」、内側は「その処理が成立した」。
      //   外側しか見ていなかったので、createSale が二重計上を止めたとき
      //   （{ok:false, conflict:true}）でも画面は「会計しました。」と出して
      //   **かごを空にしていた**＝売上が記録されないのに、店員は済んだと思う。
      //   売上の打ち漏らしは後から気づけないので、ここは必ず落とす。
      //   ⚠️ 内側に ok を持たない返り値（配列・null）もあるので、
      //      「okという名前が実際に付いているとき」だけ見る。
      var inner = res.result;
      if (inner && typeof inner === "object" && !Array.isArray(inner)
          && Object.prototype.hasOwnProperty.call(inner, "ok") && inner.ok === false) {
        throw new Error(String(inner.error || inner.reason || "できませんでした。もう一度お試しください。"));
      }
      return inner;
    }).catch(function (e) {
      // 🔴 ブラウザが出す英語をそのまま見せない（店の人には意味が分からない）。
      //    "Failed to fetch" は圏外・機内モード・接続先が違う のどれか。
      //    ⚠️ ただし**握りつぶさない**。何が起きたかは伝えたうえで、次にやることを書く。
      var m = String((e && e.message) || e || "");
      if (/failed to fetch|networkerror|load failed/i.test(m)) {
        throw new Error("電波が届いていないようです。つながる場所でもう一度お試しください。");
      }
      throw e;
    }).finally(function () { busy(false); });
  }

  // ---- 鍵とセッション ------------------------------------------------------
  // 🔴 鍵はURL（アクセスキーQR）から来る。読んだら端末に覚え、**URLからは消さない**。
  //    消すと、ホーム画面に追加したときのURLに鍵が入らず、次から入れなくなる
  //    （2026-07-31に実機で踏んだ。iOSのショートカットは別の保存領域を持つ）。
  // 🔴 GASの宛先は**既定で持つ**。理由は2つ:
  //   ① URLが短くなる＝これから焼くアクセスキーQRのマス目が減って読み取りが速くなる
  //   ② 打ち間違えようが無くなる（api= を手で書かせない）
  //   ⚠️ 引数の api= が来たらそちらを優先する（デプロイを移したときの逃げ道を残す）。
  //   ⚠️ ここは admin-app の /exec。**変えるときは deploy ID ごと**。
  //      引数なしの clasp deploy でIDが変わると、ここも直さないと繋がらなくなる。
  var API_DEFAULT = "https://script.google.com/macros/s/" +
    "AKfycbw2BGhgYrZujEVnpxEgkJsurAWLKD-KUZuMEuxb3ig302pBt7K1wE15a5Af3yaqCaoN/exec";

  KEY = qs("k") || get(K_KEY);
  API = qs("api") || get(K_API) || API_DEFAULT;
  if (KEY) set(K_KEY, KEY);
  if (API) set(K_API, API);
  SESSION = get(K_SES);

  // 接続先は script.google.com だけ（別のどこかへ鍵を送らせない）
  if (API && API.indexOf("https://script.google.com/") !== 0) API = API_DEFAULT;

  function enter(session, who, role) {
    SESSION = session || "";
    WHO = who || "";
    if (SESSION) set(K_SES, SESSION);
    $("who").textContent = WHO;
    // 🔴 管理モードを出すかどうかは**サーバが返した役割**だけで決める。
    //    覚えている値や画面の状態から推測しない。
    //    ⚠️ ここで出さなくても守りにはならない（守るのはサーバ側の requireAdmin_）。
    //       出す理由は「代表・手伝いに、押しても拒否される道を見せない」ため。
    $("home-admin").style.display = (role === "master") ? "" : "none";
    stack = [];
    go("home");
    prefetchQuickReg();   // 押した瞬間に飛べるよう、裏で用意しておく
  }

  // ==========================================================================
  // QRを貼って登録する（/quickreg/ へ渡す）
  //
  // 🔴 作り直さない。/quickreg/ は既に自社ドメインで動いていて、
  //    **端末ごとのカメラの癖**（Galaxy=OSカメラ可／Oppo=ページ内カメラ必須）まで
  //    解決済み。ここへ持ち込むと、その苦労をやり直すことになる。
  //
  // 🔴 移動は1回だけ残る。だが実測で **98KB / 0.27秒**（同じドメイン内）。
  //    いままで挟んでいたGASは 240KB / 1.62秒 だったので、**6倍速い**。
  //    しかもGoogleの注意表示もログインのやり直しも無い。
  //
  //    ⚠️ 押してからトークンを取ると「準備しています…」を挟むことになる（今までの形）。
  //    ホームを出した時点で裏で取っておき、**押した瞬間に飛ぶ**ようにする。
  // ==========================================================================
  var QR_PRE = { url: "", expMs: 0, getting: false };
  var QR_MIN_REMAIN_MS = 10 * 60 * 1000;   // 残り10分を切ったら取り直す（棚の前で切れないように）

  function prefetchQuickReg() {
    if (QR_PRE.getting) return;
    if (QR_PRE.url && Date.now() < QR_PRE.expMs - QR_MIN_REMAIN_MS) return;
    QR_PRE.getting = true;
    call("issueQuickRegToken", {}).then(function (r) {
      QR_PRE.url = (r && r.url) || "";
      QR_PRE.expMs = (r && r.expMs) || (Date.now() + 30 * 60 * 1000);
    }).catch(function () {
      // 🔴 ここは黙って落ちてよい（押した時にもう一度取るので、行き止まりにはならない）。
      //    ただし押した時の失敗は**必ず画面に出す**（下）。
      QR_PRE.url = "";
    }).finally(function () { QR_PRE.getting = false; });
  }

  function openQuickReg() {
    // 用意が済んでいれば、画面を出さずにそのまま飛ぶ（1タップ）
    if (QR_PRE.url && Date.now() < QR_PRE.expMs - QR_MIN_REMAIN_MS) {
      location.href = QR_PRE.url;
      return;
    }
    // 間に合っていないときだけ画面を出す＝待たされている理由が見える
    go("quickreg");
    var msg = $("qr-msg");
    msg.className = "msg";
    msg.textContent = "準備しています…";
    call("issueQuickRegToken", {}).then(function (r) {
      if (r && r.url) { location.href = r.url; return; }
      msg.className = "msg err";
      msg.textContent = "登録ページのURLを受け取れませんでした。もう一度お試しください。";
    }).catch(function (e) {
      msg.className = "msg err";
      msg.textContent = e.message;
    });
  }
  $("qr-retry").addEventListener("click", function () {
    QR_PRE.url = "";           // 覚えている古いURLを捨ててから取り直す
    openQuickReg();
  });

  // ==========================================================================
  // 売上を入れる
  //
  // 流れ: QRを続けて読む → かごに貯まる → 値引き（任意）→ 会計
  //
  // 🔴 金額はサーバが決める。画面の数字は**確かめ算**として送るだけ。
  //    createSale は商品マスタの店頭価格から小計・値引き・受領額を自分で計算し、
  //    こちらが送った expectedTotal と食い違えば**登録を拒否する**
  //    （かごに入れた後で誰かが値段を直した、を検知するため）。
  //
  // 🔴 operationId は必須。二重会計を止める鍵なので、
  //    **会計1回につき1つ**作り、成功するまで同じものを使い回す
  //    （押し直しても2件にならない）。
  // ==========================================================================
  var cart = [];              // [{masterId, name, listPrice, image}]
  var saleOpId = "";          // いまの会計の識別子（成功したら捨てる）

  function yen(n) { return "¥" + Number(n || 0).toLocaleString("ja-JP"); }
  function newOpId() {
    return "kanri-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  }

  function saleSubtotal() {
    var s = 0;
    for (var i = 0; i < cart.length; i++) s += Number(cart[i].listPrice || 0);
    return s;
  }
  function saleDiscountYen() {
    var v = Number($("sale-disc").value || 0);
    if (!v || v < 0) return 0;
    if ($("sale-disc-type").value === "pct") {
      // ％は小計に掛ける。端数は切り捨て（サーバも同じ規則で計算し直す）
      return Math.floor(saleSubtotal() * Math.min(v, 100) / 100);
    }
    return Math.min(v, saleSubtotal());
  }

  function renderCart() {
    var box = $("sale-cart");
    $("sale-cart-card").style.display = cart.length ? "" : "none";
    $("sale-count").textContent = cart.length ? "（" + cart.length + "点）" : "";
    if (!cart.length) { box.innerHTML = ""; return; }
    var h = "";
    for (var i = 0; i < cart.length; i++) {
      var it = cart[i];
      h += '<div style="display:flex; align-items:center; gap:10px; padding:8px 0;' +
           ' border-bottom:1px solid var(--line);">' +
           (it.image ? '<img src="' + esc(it.image) + '" alt="" style="width:44px;height:44px;' +
                       'object-fit:cover;border-radius:8px;">' : '') +
           '<div style="flex:1; min-width:0;">' +
           '<div style="font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' +
           esc(it.name || it.masterId) + "</div>" +
           '<div class="sub" style="font-size:12px;">' + esc(it.masterId) + "　" + yen(it.listPrice) + "</div>" +
           "</div>" +
           '<button type="button" class="sale-del" data-i="' + i + '" ' +
           'style="min-width:44px;min-height:44px;border:0;background:transparent;' +
           'color:var(--danger);font-size:20px;cursor:pointer;" aria-label="かごから外す">×</button>' +
           "</div>";
    }
    box.innerHTML = h;
    var dels = box.querySelectorAll(".sale-del");
    for (var j = 0; j < dels.length; j++) {
      (function (b) {
        b.addEventListener("click", function () {
          cart.splice(Number(b.getAttribute("data-i")), 1);
          renderCart();
        });
      })(dels[j]);
    }
    renderTotal();
  }

  function renderTotal() {
    var sub = saleSubtotal();
    var d = saleDiscountYen();
    var t = $("sale-total");
    t.innerHTML = d
      ? '<span class="sub" style="font-weight:400;">小計 ' + yen(sub) +
        "　値引き −" + yen(d) + "</span><br>お会計 " + yen(sub - d)
      : "お会計 " + yen(sub);
  }
  $("sale-disc").addEventListener("input", renderTotal);
  $("sale-disc-type").addEventListener("change", renderTotal);

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function addToCart() {
    var raw = String($("sale-input").value || "").trim();
    var msg = $("sale-msg");
    if (!raw) { msg.className = "msg err"; msg.textContent = "QRを読むか、商品IDを入れてください。"; return; }
    msg.className = "msg"; msg.textContent = "調べています…";
    call("resolveCartItem", { rawText: raw }).then(function (it) {
      if (!it) {
        msg.className = "msg err";
        msg.textContent = "この商品が見つかりません。IDを確かめてください。";
        return;
      }
      // 🔴 同じ品を2回入れない（一点物なので、2回読んだのは読み間違い）
      for (var i = 0; i < cart.length; i++) {
        if (cart[i].masterId === it.masterId) {
          msg.className = "msg err";
          msg.textContent = "この品はもうかごに入っています（" + it.masterId + "）。";
          $("sale-input").value = "";
          return;
        }
      }
      // 🔴【2026-08-01・Codex監査4】値段が無い品をかごに入れない。
      //   以前はサーバが空欄を0円に読み替えて返していたので、そのまま0円で会計が通り、
      //   売上にも取引台帳にも0円で残った（画面の合計もサーバの計算も0円になるので、
      //   金額の照合でも気づけない）。後から「いくらで売ったか」を復元できない。
      if (it.listPrice === null || it.listPrice === undefined) {
        msg.className = "msg err";
        msg.textContent = "この品はまだ値段がついていません（" + it.masterId +
          "）。ホームの「ねだんをつける」で先に入れてください。";
        $("sale-input").value = "";
        return;
      }
      // 🔴 売れている品を黙って入れない
      if (it.stockStatus && it.stockStatus !== "在庫あり") {
        msg.className = "msg err";
        msg.textContent = "この品は「" + it.stockStatus + "」です。かごに入れませんでした。";
        $("sale-input").value = "";
        return;
      }
      cart.push(it);
      $("sale-input").value = "";
      msg.className = "msg ok";
      msg.textContent = "入れました: " + (it.name || it.masterId);
      renderCart();
      $("sale-input").focus();
    }).catch(function (e) {
      msg.className = "msg err";
      msg.textContent = e.message;
    });
  }
  $("sale-add").addEventListener("click", addToCart);
  $("sale-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); addToCart(); }
  });

  $("sale-go").addEventListener("click", function () {
    if (!cart.length) return;
    var res = $("sale-result");
    var sub = saleSubtotal();
    var d = saleDiscountYen();
    var dv = Number($("sale-disc").value || 0);
    if (!window.confirm(
      cart.length + "点　" + yen(sub - d) + " で会計します。よろしいですか？\n\n" +
      cart.map(function (x) { return "・" + (x.name || x.masterId) + "　" + yen(x.listPrice); }).join("\n")
    )) return;

    // 🔴 成功するまで同じ operationId を使う＝押し直しても2件にならない
    if (!saleOpId) saleOpId = newOpId();
    $("sale-go").disabled = true;
    res.className = "msg"; res.textContent = "登録しています…";
    call("createSale", {
      cart: cart.map(function (x) { return x.masterId; }),
      name: "", date: "",
      operationId: saleOpId,
      // 値引きはサーバが計算し直す。こちらは「何を指定したか」を渡すだけ。
      discountSpec: dv > 0 ? { type: $("sale-disc-type").value, value: dv } : null,
      // 🔴 画面に出していた合計。サーバの計算と違えば拒否される（値段が動いた検知）
      expectedTotal: sub - d
    }).then(function (r) {
      res.className = "msg ok";
      // 🔴 サーバが「既に登録済み」と言ったらそう出す（通信のやり直し等で2回届いた場合）。
      //    「会計しました。」と出すと、もう一度会計しようとして本当の二重計上を招く。
      res.textContent = (r && r.idempotent && r.note) ? String(r.note) : "会計しました。";
      cart = [];
      saleOpId = "";
      $("sale-disc").value = "";
      renderCart();
      loadToday();
    }).catch(function (e) {
      res.className = "msg err";
      res.textContent = e.message;
      // 🔴 opId は捨てない。同じ会計をもう一度押したときに二重登録しないため。
    }).finally(function () {
      $("sale-go").disabled = false;
    });
  });

  function loadToday() {
    var box = $("sale-today");
    call("listTodaySoldProducts", {}).then(function (rows) {
      rows = rows || [];
      if (!rows.length) { box.textContent = "まだありません。"; return; }
      var h = "";
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        h += '<div style="display:flex; align-items:center; gap:8px; padding:7px 0;' +
             ' border-bottom:1px solid var(--line);">' +
             '<div style="flex:1; min-width:0; font-size:14px; overflow:hidden;' +
             ' text-overflow:ellipsis; white-space:nowrap;">' +
             esc(r.name || r.masterId) + "</div>" +
             '<div class="sub" style="font-size:12px; white-space:nowrap;">' + yen(r.saleValue) + "</div>" +
             '<button type="button" class="sale-undo" data-id="' + esc(r.masterId) + '" ' +
             'style="min-height:44px;padding:0 10px;border:1px solid var(--line);' +
             'border-radius:10px;background:#fff;font:inherit;font-size:13px;cursor:pointer;">戻す</button>' +
             "</div>";
      }
      box.innerHTML = h;
      var us = box.querySelectorAll(".sale-undo");
      for (var j = 0; j < us.length; j++) {
        (function (b) {
          b.addEventListener("click", function () {
            var id = b.getAttribute("data-id");
            // 🔴【2026-08-01・Codex監査8】取り消せるのは**この店の記録だけ**。
            //   自社ECのSOLD OUT化やフリマの取り下げは戻らない（GAS側にも同じ注意書きがある）。
            //   「取消しました」とだけ出すと、ネット側も戻ったと思い込み、
            //   一点物が二重に売れる（一番取り返しがつかない）。
            if (!window.confirm(
              id + " の売上を取り消します。\n\n" +
              "※お店の記録だけが戻ります。ネットに出していた品は、\n" +
              "　ネット側の在庫は戻りません（オーナーに伝えてください）。\n\nよろしいですか？"
            )) return;
            b.disabled = true;
            call("undoTodaySale", { masterId: id }).then(function () {
              loadToday();
            }).catch(function (e) {
              b.disabled = false;
              window.alert(e.message);
            });
          });
        })(us[j]);
      }
    }).catch(function (e) {
      // 🔴 読めなかったことを「まだありません」と混ぜない
      box.innerHTML = '<span style="color:var(--danger);">今日の売上が<b>読めていません</b>' +
                      '（0件ではありません）。<br>' + esc(e.message) + "</span>";
    });
  }
  ONSHOW["sale"] = function () {
    loadToday();
    setTimeout(function () { $("sale-input").focus(); }, 60);
  };

  // ==========================================================================
  // QRで探す・直す
  //
  // 🔴 searchProducts は使わない。GAS側の許可リストに
  //    「searchProducts は**絶対に足さない**（store が旧お会計へ到達する・原価が乗る全列を返す）」
  //    と明記されている。QR/IDを1点に解決してから、その1点だけ開く。
  // 🔴 書けるのは補足メモ1列だけ（サーバ側の STORE_EDITABLE_FIELDS が絞る）。
  //    ここで他の列を送っても通らない＝画面が弱くても権限は漏れない。
  // ==========================================================================
  function openDetail(masterId) {
    var box = $("sch-detail");
    box.innerHTML = '<div class="card sub">読み込んでいます…</div>';
    // 🔴【2026-08-01・Codex監査1】ここは getAdminProductDetail を呼んでいた。
    //   あれは**全列**を返す（仕入れ値・保管場所・仕入先・売値）。画面に出していなくても、
    //   店舗モードのセッションで口が開いていれば読めてしまう。
    //   返す列を固定した store 専用の口へ差し替えた（写真のDrive走査も無いので速い）。
    call("getStoreProductDetail", { masterId: masterId }).then(function (d) {
      if (!d) {
        box.innerHTML = '<div class="card"><span class="msg err">この商品が見つかりません。</span></div>';
        return;
      }
      var rev = d["更新バージョン"];
      // 🔴【2026-08-01・Codex監査2】列名は "補足メモ" ではなく "補足・訂正メモ(人間)"。
      //   ずれていたので、既存メモは常に空欄に見え、保存すると必ず拒否されていた
      //   （STORE_EDITABLE_FIELDS が正しい列名しか受け付けないため）。
      var memo = d["補足・訂正メモ(人間)"] || "";
      box.innerHTML =
        '<div class="card">' +
        "<h2>" + esc(d["商品名"] || masterId) + "</h2>" +
        '<div class="sub" style="margin-bottom:10px;">' + esc(masterId) +
        "　" + (d["店頭価格"] === "" || d["店頭価格"] == null ? "値段まだ" : yen(d["店頭価格"])) +
        "　" + esc(d["在庫ステータス"] || "") + "</div>" +
        // 🔴【2026-08-01・Codex監査(3周目)3】保管場所を**画面に出す**。
        //   サーバは返すようにしたのに表示していなかった＝「父が現物を探せるように」という
        //   今回の意図がJSONまでで止まっていた（返しただけでは誰も見られない）。
        (d["保管場所"] ? '<div class="sub" style="margin-bottom:10px;">置き場所: ' +
          esc(d["保管場所"]) + "</div>" : "") +
        '<label class="f"><span>補足（気づいたことを足していく）</span>' +
        '<textarea id="sch-memo" rows="5" style="width:100%;min-height:120px;padding:10px 12px;' +
        'border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;' +
        'color:var(--fg);">' + esc(memo) + "</textarea></label>" +
        '<button class="btn primary" id="sch-save" type="button"><span class="t">補足を保存する</span></button>' +
        '<div class="msg" id="sch-save-msg"></div>' +
        "</div>";
      $("sch-save").addEventListener("click", function () {
        var m = $("sch-save-msg");
        var v = String($("sch-memo").value || "");
        $("sch-save").disabled = true;
        m.className = "msg"; m.textContent = "保存しています…";
        // 🔴 版数を必ず添える。無いとサーバが拒否する（古い内容で上書きさせない歯止め）。
        call("updateProductFields", {
          masterId: masterId,
          patch: { "補足・訂正メモ(人間)": v, __expectedRev: rev }
        }).then(function () {
          m.className = "msg ok";
          m.textContent = "保存しました。";
          openDetail(masterId);   // 版数を取り直す（続けて直せるように）
        }).catch(function (e) {
          m.className = "msg err";
          m.textContent = e.message;
        }).finally(function () {
          $("sch-save").disabled = false;
        });
      });
    }).catch(function (e) {
      box.innerHTML = '<div class="card"><span class="msg err">' + esc(e.message) + "</span></div>";
    });
  }

  function schGo() {
    var raw = String($("sch-input").value || "").trim();
    var msg = $("sch-msg");
    if (!raw) { msg.className = "msg err"; msg.textContent = "QRを読むか、商品IDを入れてください。"; return; }
    msg.className = "msg"; msg.textContent = "探しています…";
    call("resolveScanToMasterId", { rawText: raw }).then(function (id) {
      if (!id) {
        msg.className = "msg err";
        msg.textContent = "この商品が見つかりません。IDを確かめてください。";
        return;
      }
      msg.textContent = "";
      openDetail(id);
    }).catch(function (e) {
      msg.className = "msg err";
      msg.textContent = e.message;
    });
  }
  $("sch-go").addEventListener("click", schGo);
  $("sch-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); schGo(); }
  });
  ONSHOW["search"] = function () {
    setTimeout(function () { $("sch-input").focus(); }, 60);
  };

  // ==========================================================================
  // 未値付けに値段をつける
  //
  // 🔴 setStorePrice は**値段が空の品にしか書けない**（変更はできない）。
  //    値段を直すのは商品一覧の storeChangePrice＝役割を混ぜない、という設計。
  // ==========================================================================
  function loadPricing() {
    var msg = $("pri-msg");
    var box = $("pri-list");
    msg.className = "msg"; msg.textContent = "読み込んでいます…";
    box.innerHTML = "";
    call("listUnpricedForPricing", {}).then(function (rows) {
      rows = rows || [];
      $("pri-count").textContent = "（" + rows.length + "点）";
      if (!rows.length) {
        msg.className = "msg ok";
        msg.textContent = "値段のないものはありません。";
        return;
      }
      msg.textContent = "";
      var h = "";
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var id = r.masterId || r["マスターID"] || "";
        var nm = r.name || r["商品名"] || id;
        var rev = (r.rev != null ? r.rev : r["更新バージョン"]) || 0;
        // 🔴【2026-08-01・Codex監査7】写真を出す。骨董は名前だけでは取り違える
        //   （「火鉢」が棚に何個もある）。サーバ側には getPricingThumbnails という
        //   後追いで写真だけ取る口が既にあったのに、画面が一度も呼んでいなかった。
        h += '<div class="card" data-id="' + esc(id) + '" data-rev="' + esc(rev) + '">' +
             '<div style="display:flex; gap:10px; align-items:flex-start;">' +
             '<img class="pri-th" alt="" style="width:64px;height:64px;border-radius:10px;' +
             'object-fit:cover;background:#efe9de;flex:none;">' +
             '<div style="flex:1; min-width:0;">' +
             "<h2 style=\"font-size:15px;\">" + esc(nm) + "</h2>" +
             '<div class="sub">' + esc(id) + "</div></div></div>" +
             '<div style="height:8px;"></div>' +
             '<div style="display:flex; gap:8px; align-items:flex-end;">' +
             '<label class="f" style="flex:1; margin:0;"><span>ねだん（円）</span>' +
             '<input type="number" class="pri-in" inputmode="numeric" min="1" placeholder="0"></label>' +
             '<button type="button" class="btn primary pri-save" ' +
             'style="width:auto; min-width:104px; margin:0;"><span class="t">つける</span></button>' +
             "</div>" +
             '<div class="msg pri-r"></div></div>';
      }
      box.innerHTML = h;
      // 写真は後から。取れなくても値付けは続けられる（行き止まりにしない）。
      // 🔴【2026-08-01・Codex監査4】**12点ずつ分けて取る**。
      //   サーバは1回の要求で先頭12件しか見に行かない（PRICING_THUMB_MAX_PER_CALL_）。
      //   全IDを1回で送っていたので、13点目以降は追加の要求が無く**写真が永久に空欄**だった。
      //   未値付けは一度に最大500点まで並ぶので、ほとんどの行が写真無しになる。
      //   ⚠️ 上限はサーバ側の都合（Driveを見に行く回数）なので、こちらで勝手に増やさない。
      var ids = [];
      for (var k = 0; k < rows.length; k++) {
        ids.push(rows[k].masterId || rows[k]["マスターID"] || "");
      }
      var THUMB_BATCH = 12;
      function fetchThumbs(from) {
        if (from >= ids.length) return;
        var part = ids.slice(from, from + THUMB_BATCH);
        call("getPricingThumbnails", { masterIds: part }).then(function (map) {
          if (map) {
            var cs = box.querySelectorAll(".card");
            for (var m = 0; m < cs.length; m++) {
              var u = map[cs[m].getAttribute("data-id")];
              var im = cs[m].querySelector(".pri-th");
              if (u && im && !im.src) im.src = u;
            }
          }
          fetchThumbs(from + THUMB_BATCH);   // 続きを取る（前の分が終わってから＝一度に押し寄せない）
        }).catch(function (e) {
          // 🔴【2026-08-01・Codex監査(3周目)2】続きは**成功側にしか書いていなかった**。
          //   1回でも失敗すると、そこから先は要求すらされず写真が永久に空欄になる
          //   （しかも何も出ないので、電波が一瞬切れただけと気づけない）。
          //   ログインが切れた時だけ止める。それ以外は次へ進む。
          if (isAuthError(e)) return;
          fetchThumbs(from + THUMB_BATCH);
        });
      }
      fetchThumbs(0);

      var cards = box.querySelectorAll(".card");
      for (var j = 0; j < cards.length; j++) {
        (function (c) {
          c.querySelector(".pri-save").addEventListener("click", function () {
            var input = c.querySelector(".pri-in");
            var out = c.querySelector(".pri-r");
            var price = Number(input.value || 0);
            if (!price || price < 1) {
              out.className = "msg pri-r err";
              out.textContent = "ねだんを入れてください。";
              return;
            }
            var btn = c.querySelector(".pri-save");
            btn.disabled = true;
            out.className = "msg pri-r"; out.textContent = "つけています…";
            call("setStorePrice", {
              masterId: c.getAttribute("data-id"),
              price: price,
              expectedRev: c.getAttribute("data-rev")
            }).then(function (res) {
              // 🔴【2026-08-01・Codex監査3】サーバが「仮案として送っただけ」と言うことがある。
              //   上位者（オーナー）の判断が既にある品は正本を書き換えず proposal:true を返す。
              //   返り値を見ずに「つけました」と出していたので、**値段は変わっていないのに
              //   ついたと思って会計へ進む**（店頭で違う値段を言うことになる）。
              if (res && res.proposal) {
                out.className = "msg pri-r";
                out.textContent = String(res.message ||
                  "オーナーの判断があるため、仮案としてオーナーへ送りました。");
                btn.disabled = false;
                return;   // 正本も版数も動いていないので、戻すボタンは出さない
              }
              // 🔴【2026-08-01・Codex監査2】版数を取り直す。
              //   値付けが通るとサーバは更新バージョンを必ず +1 する。
              //   data-rev を古いままにしていたので、そのあと「戻す」を押すと
              //   必ず版数不一致で拒否された＝**取り消しが一度も成功しない**。
              if (res && res.rev != null) c.setAttribute("data-rev", String(res.rev));
              // 🔴【2026-08-01・Codex監査7】「間違えても自分で戻せる」をつなぐ。
              //   サーバには undoStorePrice（15分以内）があったのに画面から呼んでおらず、
              //   700msでカードが消えるだけだった＝桁を1つ間違えても取り返せない。
              //   主な使い手は代表(父)なので、ここは戻せることが要件。
              out.className = "msg pri-r ok";
              out.innerHTML = "つけました（" + esc(yen(price)) + "）。&nbsp;" +
                '<button type="button" class="pri-undo" style="min-height:44px;padding:6px 14px;' +
                'border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;' +
                'font-weight:700;cursor:pointer;">まちがえた（戻す）</button>';
              var undo = out.querySelector(".pri-undo");
              var closeTimer = setTimeout(function () {
                c.remove();
                var left = box.querySelectorAll(".card").length;
                $("pri-count").textContent = "（" + left + "点）";
                if (!left) { msg.className = "msg ok"; msg.textContent = "全部つけ終わりました。"; }
              }, 8000);   // 押す間を置く（700msでは戻すボタンを読む前に消えていた）
              undo.addEventListener("click", function () {
                clearTimeout(closeTimer);
                undo.disabled = true;
                call("undoStorePrice", {
                  masterId: c.getAttribute("data-id"),
                  expectedRev: c.getAttribute("data-rev")
                }).then(function () {
                  out.className = "msg pri-r";
                  out.textContent = "戻しました。もう一度つけてください。";
                  input.value = "";
                  btn.disabled = false;
                  loadPricing();     // 版数が変わるので取り直す
                }).catch(function (e2) {
                  undo.disabled = false;
                  out.className = "msg pri-r err";
                  out.textContent = e2.message;
                });
              });
            }).catch(function (e) {
              btn.disabled = false;
              out.className = "msg pri-r err";
              out.textContent = e.message;
            });
          });
        })(cards[j]);
      }
    }).catch(function (e) {
      // 🔴 読めなかったことを「0点」と混ぜない
      msg.className = "msg err";
      msg.textContent = "一覧が読めていません（0点ではありません）。" + e.message;
      $("pri-count").textContent = "";
    });
  }
  ONSHOW["pricing"] = loadPricing;

  // ==========================================================================
  // 商品一覧
  //
  // 🔴 オーナー方針「オーナーがガード機能」＝ここでは条件で弾かない。
  //    代わりに、やったことは必ず記録に残る（サーバ側 logStoreChangeOrThrow_）。
  // ==========================================================================
  var LST = { offset: 0, limit: 50, keyword: "", done: false };

  // 🔴【2026-08-01・Codex監査(3周目)4】写真を出す。
  //   このカードから**店頭価格とネット候補を変えられる**のに、名前とIDしか出ていなかった。
  //   骨董は「火鉢」「木彫の鳥」のように似た名前が並ぶので、名前だけでは別の品を触りうる。
  //   値付け画面と同じ後追い方式（画像キャッシュから12点ずつ）。Driveは見に行かない。
  // 🔴【2026-08-01・Codex監査(4周目)3】写真が出ない理由を**区別できるようにする**。
  //   写真は誤操作の歯止めとして足したのに、失敗すると「写真の無い品」と同じ空欄になり、
  //   歯止めが黙って消えていた。父・手伝いには次の3つが同じに見える:
  //     ①本当に写真が無い ②画像キャッシュに無い ③通信やDriveの取得に失敗した
  //   サーバは「写真フォルダが登録されているか(hasPhoto)」を返しているので、
  //   **登録されているのに出せなかったカードだけ**その旨を出す。操作自体は止めない
  //   （オーナー方針＝店舗側で弾かない。気づける形にするのが役目）。
  function lstMarkNoThumb(part) {
    var cs = $("lst-list").querySelectorAll(".card");
    for (var m = 0; m < cs.length; m++) {
      var id = cs[m].getAttribute("data-id");
      if (part.indexOf(id) === -1) continue;
      var im = cs[m].querySelector(".lst-th");
      if (!im || im.src) continue;
      if (cs[m].getAttribute("data-haspic") !== "1") continue;  // 元から写真が無い品は何も出さない
      if (cs[m].querySelector(".lst-nothumb")) continue;
      var note = document.createElement("div");
      note.className = "sub lst-nothumb";
      note.style.cssText = "font-size:12px;color:var(--danger);";
      note.textContent = "写真を読めませんでした（品物を確かめてから直してください）";
      im.parentNode.appendChild(note);
    }
  }

  function lstThumbs(ids, from) {
    if (from >= ids.length) return;
    var part = ids.slice(from, from + 12);
    // cacheOnly＝画像キャッシュだけを見る。付けないとサーバが1件ずつDriveを走査する
    //（50件並ぶ画面なので、開いただけで最大50回の走査になる）。
    call("getPricingThumbnails", { masterIds: part, cacheOnly: true }).then(function (map) {
      if (map) {
        var cs = $("lst-list").querySelectorAll(".card");
        for (var m = 0; m < cs.length; m++) {
          var u = map[cs[m].getAttribute("data-id")];
          var im = cs[m].querySelector(".lst-th");
          if (u && im && !im.src) im.src = u;
        }
      }
      lstMarkNoThumb(part);
      lstThumbs(ids, from + 12);
    }).catch(function (e) {
      if (isAuthError(e)) return;
      lstMarkNoThumb(part);
      lstThumbs(ids, from + 12);
    });
  }

  function lstRow(r) {
    return '<div class="card" data-id="' + esc(r.masterId) + '" data-rev="' + esc(r.rev) +
      '" data-haspic="' + (r.hasPhoto ? "1" : "0") + '">' +
      '<div style="display:flex; gap:10px; align-items:flex-start;">' +
      '<img class="lst-th" alt="" style="width:56px;height:56px;border-radius:10px;' +
      'object-fit:cover;background:#efe9de;flex:none;">' +
      '<div style="flex:1; min-width:0;">' +
      "<h2 style=\"font-size:15px;\">" + esc(r.name || r.masterId) + "</h2>" +
      '<div class="sub">' + esc(r.masterId) +
      (r.place ? "　" + esc(r.place) : "") +
      (r.legal ? '　<span style="color:var(--danger);">法規の確認あり</span>' : "") +
      "</div></div></div>" +
      '<div style="height:8px;"></div>' +
      '<div style="display:flex; gap:8px; align-items:flex-end; margin-bottom:8px;">' +
      '<label class="f" style="flex:1; margin:0;"><span>ねだん（円）</span>' +
      '<input type="number" class="lst-price" inputmode="numeric" min="1" value="' +
      (r.price == null ? "" : esc(r.price)) + '"></label>' +
      '<button type="button" class="btn primary lst-save" ' +
      'style="width:auto; min-width:104px; margin:0;"><span class="t">直す</span></button>' +
      "</div>" +
      '<button type="button" class="btn lst-cand" style="margin:0;">' +
      '<span class="t">' + (r.netCand === "✓" ? "✓ ネット候補にしている" : "ネット候補にする") + "</span></button>" +
      '<div class="msg lst-r"></div></div>';
  }

  function lstWire(c) {
    var id = c.getAttribute("data-id");
    var out = c.querySelector(".lst-r");
    function rev() { return c.getAttribute("data-rev"); }
    c.querySelector(".lst-save").addEventListener("click", function () {
      var p = Number(c.querySelector(".lst-price").value || 0);
      if (!p || p < 1) { out.className = "msg lst-r err"; out.textContent = "ねだんを入れてください。"; return; }
      var b = c.querySelector(".lst-save");
      b.disabled = true;
      out.className = "msg lst-r"; out.textContent = "直しています…";
      call("storeChangePrice", { masterId: id, price: p, expectedRev: rev() })
        .then(function (res) {
          // 🔴【2026-08-01・Codex監査3】正本が変わっていないのに成功と言わない。
          //   上位者の判断がある品はサーバが proposal:true を返し、値段は書き換えない。
          if (res && res.proposal) {
            out.className = "msg lst-r";
            out.textContent = String(res.message ||
              "オーナーの判断があるため、仮案としてオーナーへ送りました。");
            return;
          }
          out.className = "msg lst-r ok";
          out.textContent = "直しました。オーナーの画面にも出ます。";
          if (res && res.rev != null) c.setAttribute("data-rev", res.rev);
        }).catch(function (e) {
          out.className = "msg lst-r err"; out.textContent = e.message;
        }).finally(function () { b.disabled = false; });
    });
    c.querySelector(".lst-cand").addEventListener("click", function () {
      var b = c.querySelector(".lst-cand");
      var on = b.querySelector(".t").textContent.indexOf("✓") !== 0;
      b.disabled = true;
      out.className = "msg lst-r"; out.textContent = "変えています…";
      call("storeSetNetCandidate", { masterId: id, on: on, expectedRev: rev() })
        .then(function (res) {
          // 🔴 同上。正本が変わっていないならボタンの見た目も変えない
          //    （✓が付いたのに実際は付いていない＝一番たちの悪いズレ）。
          if (res && res.proposal) {
            out.className = "msg lst-r";
            out.textContent = String(res.message ||
              "オーナーの判断があるため、仮案としてオーナーへ送りました。");
            return;
          }
          b.querySelector(".t").textContent = on ? "✓ ネット候補にしている" : "ネット候補にする";
          out.className = "msg lst-r ok";
          out.textContent = on ? "ネット候補にしました。" : "ネット候補から外しました。";
          if (res && res.rev != null) c.setAttribute("data-rev", res.rev);
        }).catch(function (e) {
          out.className = "msg lst-r err"; out.textContent = e.message;
        }).finally(function () { b.disabled = false; });
    });
  }

  function loadList(more) {
    var msg = $("lst-msg");
    var box = $("lst-list");
    if (!more) { LST.offset = 0; LST.done = false; box.innerHTML = ""; }
    msg.className = "msg"; msg.textContent = "さがしています…";
    $("lst-more").style.display = "none";
    call("storeListProducts", {
      opts: { keyword: LST.keyword, offset: LST.offset, limit: LST.limit }
    }).then(function (res) {
      var rows = (res && res.items) || res || [];
      if (!Array.isArray(rows)) rows = [];
      if (!rows.length && !LST.offset) {
        msg.className = "msg";
        msg.textContent = LST.keyword ? "見つかりませんでした。" : "まだ1点もありません。";
        return;
      }
      msg.textContent = "";
      var h = "";
      for (var i = 0; i < rows.length; i++) h += lstRow(rows[i]);
      box.insertAdjacentHTML("beforeend", h);
      var cards = box.querySelectorAll(".card");
      for (var j = cards.length - rows.length; j < cards.length; j++) lstWire(cards[j]);
      // 🔴 写真は後追いで12点ずつ（Codex監査(3周目)4）。値付け画面と同じ作り。
      //    途中で失敗しても続きへ進む（1回の失敗で以降が全部空欄にならないように）。
      lstThumbs(rows.map(function (r) { return r.masterId; }), 0);
      LST.offset += rows.length;
      // 満杯で返ってきたら、まだ先がある
      $("lst-more").style.display = (rows.length >= LST.limit) ? "" : "none";
    }).catch(function (e) {
      msg.className = "msg err";
      msg.textContent = "一覧が読めていません（0点ではありません）。" + e.message;
    });
  }
  $("lst-go").addEventListener("click", function () {
    LST.keyword = String($("lst-q").value || "").trim();
    loadList(false);
  });
  $("lst-q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); $("lst-go").click(); }
  });
  $("lst-more").addEventListener("click", function () { loadList(true); });
  ONSHOW["list"] = function () { if (!$("lst-list").children.length) loadList(false); };

  // ==========================================================================
  // ここから管理モード（オーナーのみ）
  //
  // 🔴 見せる／隠すは**見やすさのため**。守っているのはサーバ側で、
  //    代表・手伝いのセッションでは requireAdmin_ がこれらの操作を拒否する。
  //    画面から消すことを対策と呼ばない（CLAUDE.md「絞り込みはサーバ側で行う」）。
  // ==========================================================================

  /// 直してよい列。🔴 ここに無い列は画面に出さない。
  ///   出す＝直せると見えることなので、直せない列を並べると「保存できない画面」になる。
  var EDIT_FIELDS = [
    ["商品名", "text"],
    ["カテゴリ", "select"],
    ["保管場所", "text"],
    ["店頭価格", "number"],
    ["採寸", "text"],
    ["状態メモ", "textarea"],
    ["補足・訂正メモ(人間)", "textarea"]
  ];
  var CATEGORY_OPTIONS = null;   // 一度取ったら覚える

  function editRender(masterId, d) {
    var rev = d["更新バージョン"];
    var h = '<div class="card"><h2>' + esc(d["商品名"] || masterId) + "</h2>" +
            '<div class="sub" style="margin-bottom:10px;">' + esc(masterId) +
            "　" + esc(d["在庫ステータス"] || "") + "</div>";
    for (var i = 0; i < EDIT_FIELDS.length; i++) {
      var name = EDIT_FIELDS[i][0], kind = EDIT_FIELDS[i][1];
      var v = d[name] == null ? "" : String(d[name]);
      h += '<label class="f"><span>' + esc(name) + "</span>";
      if (kind === "textarea") {
        h += '<textarea data-f="' + esc(name) + '" rows="4" style="width:100%;min-height:96px;' +
             'padding:10px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;' +
             'background:#fff;color:var(--fg);">' + esc(v) + "</textarea>";
      } else if (kind === "select") {
        h += '<select data-f="' + esc(name) + '" class="input" style="width:100%;min-height:52px;">' +
             '<option value="">（未設定）</option>';
        var opts = CATEGORY_OPTIONS || [];
        var found = false;
        for (var k = 0; k < opts.length; k++) {
          var o = String(opts[k]);
          if (o === v) found = true;
          h += '<option value="' + esc(o) + '"' + (o === v ? " selected" : "") + ">" + esc(o) + "</option>";
        }
        // 🔴 いまの値が選択肢に無いとき、黙って「（未設定）」にしない（保存すると消える）
        if (v && !found) h += '<option value="' + esc(v) + '" selected>' + esc(v) + "（いまの値）</option>";
        h += "</select>";
      } else {
        h += '<input type="' + (kind === "number" ? "number" : "text") + '" data-f="' + esc(name) +
             '" value="' + esc(v) + '">';
      }
      h += "</label>";
    }
    h += '<button class="btn primary" id="edt-save" type="button"><span class="t">保存する</span></button>' +
         '<div class="msg" id="edt-save-msg"></div></div>';
    $("edt-detail").innerHTML = h;

    $("edt-save").addEventListener("click", function () {
      var m = $("edt-save-msg");
      var patch = { __expectedRev: rev };
      var changed = 0;
      var fields = $("edt-detail").querySelectorAll("[data-f]");
      for (var j = 0; j < fields.length; j++) {
        var f = fields[j];
        var nm = f.getAttribute("data-f");
        var now = String(f.value == null ? "" : f.value);
        var was = d[nm] == null ? "" : String(d[nm]);
        // 🔴 変えていない列は送らない。全部送ると、他の人が直した列まで
        //    自分が読んだ古い値で上書きしてしまう。
        if (now !== was) { patch[nm] = now; changed += 1; }
      }
      if (!changed) { m.className = "msg"; m.textContent = "変わっていません。"; return; }
      $("edt-save").disabled = true;
      m.className = "msg"; m.textContent = "保存しています…";
      call("updateProductFields", { masterId: masterId, patch: patch }).then(function (r) {
        // 🔴【2026-08-01・Codex監査2】**送った件数ではなく、サーバが保存した件数**を出す。
        //   GASは EDITABLE_FIELDS に無い列を例外にせず黙って捨てる。送信件数を数えて
        //   「3か所を保存しました。」と出していたので、実際には1つも書かれていなくても
        //   保存できたように見えた（実際 "実寸サイズ" は存在しない列で、ずっと捨てられていた）。
        var saved = (r && r.saved) || [];
        var n = saved.length;
        m.className = n === changed ? "msg ok" : "msg err";
        if (n === 0) {
          m.textContent = "保存されませんでした。もう一度お試しください。";
        } else if (n < changed) {
          m.textContent = n + "か所だけ保存しました（" + (changed - n) + "か所は保存できていません）。";
        } else {
          m.textContent = n + "か所を保存しました。";
        }
        if (r && r.warning) m.textContent += " " + r.warning;
        editOpen(masterId);      // 版数を取り直す
      }).catch(function (e) {
        m.className = "msg err";
        m.textContent = e.message;
      }).finally(function () { $("edt-save").disabled = false; });
    });
  }

  function editOpen(masterId) {
    $("edt-detail").innerHTML = '<div class="card sub">読み込んでいます…</div>';
    var need = CATEGORY_OPTIONS ? Promise.resolve(CATEGORY_OPTIONS)
      : call("getCategoryOptions", {}).then(function (o) {
          CATEGORY_OPTIONS = (o && o.categories) || o || [];
          return CATEGORY_OPTIONS;
        }).catch(function () {
          // 🔴 選択肢が取れなくても編集は続けられる（いまの値は上で残す）
          CATEGORY_OPTIONS = [];
          return CATEGORY_OPTIONS;
        });
    need.then(function () {
      return call("getAdminProductDetail", { masterId: masterId });
    }).then(function (d) {
      if (!d) {
        $("edt-detail").innerHTML = '<div class="card"><span class="msg err">この商品が見つかりません。</span></div>';
        return;
      }
      editRender(masterId, d);
    }).catch(function (e) {
      $("edt-detail").innerHTML = '<div class="card"><span class="msg err">' + esc(e.message) + "</span></div>";
    });
  }

  function edtGo() {
    var raw = String($("edt-input").value || "").trim();
    var msg = $("edt-msg");
    if (!raw) { msg.className = "msg err"; msg.textContent = "QRを読むか、商品IDを入れてください。"; return; }
    msg.className = "msg"; msg.textContent = "探しています…";
    call("resolveScanToMasterId", { rawText: raw }).then(function (id) {
      if (!id) { msg.className = "msg err"; msg.textContent = "この商品が見つかりません。"; return; }
      msg.textContent = "";
      editOpen(id);
    }).catch(function (e) { msg.className = "msg err"; msg.textContent = e.message; });
  }
  $("edt-go").addEventListener("click", edtGo);
  $("edt-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); edtGo(); }
  });
  ONSHOW["edit"] = function () { setTimeout(function () { $("edt-input").focus(); }, 60); };

  // ---- QRからネット出品 ----------------------------------------------------
  // 🔴【2026-08-01・Codex監査3】サーバが返すのは
  //   { blocked, blockReason, warnings[], isLargeItem, alreadyQueued } で、
  //   eligible も blockers も name も**返らない**。
  //   ここは el.eligible を見ていたので常に false ＝出せる品でも送信ボタンが出ず、
  //   「QRからネット出品」が最初から一度も使えなかった。エラーは出ない。
  function netRender(masterId, el) {
    var blocked = !!(el && el.blocked);
    var warnings = (el && el.warnings) || [];
    if (!Array.isArray(warnings)) warnings = [warnings];
    var h = '<div class="card"><h2>' + esc(masterId) + "</h2>";
    if (el && el.alreadyQueued) {
      h += '<div class="msg ok" style="margin-bottom:10px;">この品はもう出品リストに入っています。</div>';
    }
    if (blocked) {
      // 🔴 出せない理由を必ず出す。「出せません」だけだと、棚の前で手が止まる。
      h += '<div class="msg err" style="margin-bottom:6px;">まだ出せません。</div>' +
           '<div style="margin-bottom:10px;">' +
           esc((el && el.blockReason) || "理由がサーバから返っていません。管理ページで確かめてください。") +
           "</div>" +
           '<button class="btn" id="net-edit" type="button">' +
           '<span class="t">この品を直しに行く</span></button>';
    } else {
      h += '<div class="msg ok" style="margin-bottom:10px;">ネットに出せます。</div>';
      if (warnings.length) {
        // 未入力があっても出せる。ただし何が足りないかは見せる（了承して送る形）。
        h += '<div class="sub" style="margin-bottom:4px;">足りていないもの:</div>' +
             "<ul style=\"margin:0 0 10px 18px; font-size:14px;\">";
        for (var i = 0; i < warnings.length; i++) h += "<li>" + esc(warnings[i]) + "</li>";
        h += "</ul>";
      }
      h += '<button class="btn primary" id="net-add" type="button">' +
           '<span class="t">' + (warnings.length ? "このまま出品リストへ送る" : "出品リストへ送る") +
           "</span></button>";
      if (warnings.length) {
        h += '<button class="btn" id="net-edit" type="button" style="margin-top:8px;">' +
             '<span class="t">先に直しに行く</span></button>';
      }
    }
    h += '<button class="btn" id="net-shot" type="button" style="margin-top:8px;">' +
         '<span class="t">ぐるっと撮る（ターンテーブル）</span></button>' +
         '<div class="msg" id="net-r"></div></div>';
    $("net-detail").innerHTML = h;

    var ok = !blocked;
    if (ok) {
      $("net-add").addEventListener("click", function () {
        var r = $("net-r");
        $("net-add").disabled = true;
        r.className = "msg"; r.textContent = "送っています…";
        // 🔴 未入力があるときサーバは {ok:false, needsAcknowledge:true} を返す。
        //   了承したうえで送る形にしないと、画面に理由も出ないまま失敗し続ける。
        call("addToNetListingQueue", {
          masterId: masterId,
          acknowledgeWarnings: warnings.length > 0
        }).then(function (res) {
          r.className = "msg ok";
          r.textContent = (res && res.alreadyQueued)
            ? "この品はもう出品リストに入っています。"
            : "出品リストへ送りました。出す／出さないはPC版で決めます。";
        }).catch(function (e) {
          $("net-add").disabled = false;
          r.className = "msg err"; r.textContent = e.message;
        });
      });
    } else {
      $("net-edit").addEventListener("click", function () {
        $("edt-input").value = masterId;
        go("edit");
        editOpen(masterId);
      });
    }
    $("net-shot").addEventListener("click", function () {
      var r = $("net-r");
      r.className = "msg"; r.textContent = "撮影ページを用意しています…";
      call("issueTurntableCaptureToken", { masterId: masterId }).then(function (res) {
        if (res && res.url) { location.href = res.url; return; }
        r.className = "msg err";
        r.textContent = "撮影ページのURLを受け取れませんでした。";
      }).catch(function (e) { r.className = "msg err"; r.textContent = e.message; });
    });
  }

  function netGo() {
    var raw = String($("net-input").value || "").trim();
    var msg = $("net-msg");
    if (!raw) { msg.className = "msg err"; msg.textContent = "QRを読むか、商品IDを入れてください。"; return; }
    msg.className = "msg"; msg.textContent = "確かめています…";
    call("resolveScanToMasterId", { rawText: raw }).then(function (id) {
      if (!id) { msg.className = "msg err"; msg.textContent = "この商品が見つかりません。"; return; }
      return call("getNetListingEligibility", { masterId: id }).then(function (el) {
        msg.textContent = "";
        netRender(id, el);
      });
    }).catch(function (e) { msg.className = "msg err"; msg.textContent = e.message; });
  }
  $("net-go").addEventListener("click", netGo);
  $("net-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); netGo(); }
  });
  // ==========================================================================
  // 出品リスト（見るだけ）
  // 🔴 決めるのはPC版。ここで「出す／出さない」を押せるようにしない
  //    （判断の位が owner_pc より下になり、あとから走った方が勝つ形になる）。
  // ==========================================================================
  function loadQueue() {
    var msg = $("q-msg"), box = $("q-list");
    msg.className = "msg"; msg.textContent = "読み込んでいます…"; box.innerHTML = "";
    // 🔴 スマホは軽い方を呼ぶ（Codex監査6）。重い方はPC版が使う。
    call("getNetListingQueueLite", {}).then(function (rows) {
      rows = Array.isArray(rows) ? rows : [];
      if (!rows.length) {
        msg.className = "msg";
        msg.textContent = "まだ何も送られていません。";
        return;
      }
      msg.textContent = "";
      var h = "";
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var th = r.photo || "";
        h += '<div class="card"><div style="display:flex; gap:10px; align-items:flex-start;">' +
             (th ? '<img src="' + esc(th) + '" alt="" style="width:64px;height:64px;border-radius:10px;' +
                   'object-fit:cover;background:#efe9de;flex:none;">' : "") +
             '<div style="flex:1; min-width:0;">' +
             "<h2 style=\"font-size:15px;\">" + esc(r.name || r.masterId) + "</h2>" +
             '<div class="sub">' + esc(r.masterId) + "　" + esc(r.status || "候補") + "</div>" +
             '<div class="sub">' +
             (r.confirmedPrice ? "確定 " + esc(yen(r.confirmedPrice))
                               : (r.storePrice !== "" ? "店頭 " + esc(yen(r.storePrice)) : "値段まだ")) +
             "</div>" +
             (r.listedAnywhere ? '<div class="msg ok" style="font-size:13px;">もう出品済みです</div>' : "") +
             (r.masterNotFound ? '<div class="msg err" style="font-size:13px;">商品マスタに見つかりません</div>' : "") +
             "</div></div></div>";
      }
      box.innerHTML = h;
    }).catch(function (e) {
      // 🔴 読めなかったことを「0件」と混ぜない
      msg.className = "msg err";
      msg.textContent = "出品リストが読めていません（0件ではありません）。" + e.message;
    });
  }
  ONSHOW["queue"] = loadQueue;

  ONSHOW["netlist"] = function () { setTimeout(function () { $("net-input").focus(); }, 60); };

  function start() {
    if (!KEY || !API) { show("nokey"); return; }
    // 覚えているセッションで入れるか試す（PINを毎回聞かない）
    if (SESSION) {
      call("kanriWhoAmI", {}).then(function (r) {
        enter(SESSION, (r && r.name) || "", (r && r.role) || "");
      }).catch(function () {
        SESSION = ""; set(K_SES, "");
        askPin();
      });
      return;
    }
    askPin();
  }

  // PIN前の短命トークン（5分）。PIN画面を出している間だけ持つ。
  var PRE = "";

  function askPin() {
    // 🔴 PINが要るかどうかは**サーバが決める**（人ごとに違う・設定していない人もいる）。
    //    要らない人にPIN画面を見せない。
    call("kanriOpen", { accessKey: KEY }).then(function (r) {
      if (r && r.session) { enter(r.session, r.name, r.role); return; }
      if (r && r.needPin) {
        PRE = r.pre || "";
        $("pin-title").textContent = (r.name ? r.name + " さんの" : "") + "PINを入れてください";
        show("pin");
        setTimeout(function () { $("pin").focus(); }, 50);
        return;
      }
      // 🔴 想定していない返りを「たぶん大丈夫」で流さない。
      show("nokey");
    }).catch(function (e) {
      // 鍵が使えない・電波が無い等。**理由をそのまま出す**（黙って入口へ戻さない）。
      show("nokey");
      var box = $("v-nokey").querySelector(".card");
      var p = document.createElement("p");
      p.className = "msg err";
      p.textContent = e.message;
      box.appendChild(p);
    });
  }

  $("pin-go").addEventListener("click", function () {
    var pin = String($("pin").value || "").trim();
    if (!pin) { $("pin-msg").className = "msg err"; $("pin-msg").textContent = "PINを入れてください。"; return; }
    if (!PRE) {
      // 5分を過ぎて画面だけ残っている等。入口からやり直す。
      $("pin-msg").className = "msg err";
      $("pin-msg").textContent = "時間が経ちすぎました。もう一度読み込み直してください。";
      return;
    }
    $("pin-msg").className = "msg"; $("pin-msg").textContent = "確かめています…";
    // 🔴 照合は既存の verifyAdminPin（回数制限・ロックアウト込み）を通る口へ渡す。
    //    ここで独自に判定しない＝締め出しの数え方が2か所に散らない。
    call("kanriVerifyPin", { pre: PRE, pin: pin }).then(function (r) {
      if (r && r.session) {
        $("pin").value = ""; $("pin-msg").textContent = ""; PRE = "";
        enter(r.session, r.name, r.role);
        return;
      }
      $("pin-msg").className = "msg err";
      $("pin-msg").textContent = "入れませんでした。もう一度お試しください。";
    }).catch(function (e) {
      // サーバが理由を日本語で返す（回数超過・期限切れ・無効化など）。そのまま見せる。
      $("pin-msg").className = "msg err";
      $("pin-msg").textContent = e.message;
    });
  });
  $("pin").addEventListener("keydown", function (e) {
    if (e.key === "Enter") $("pin-go").click();
  });

  start();
  pushHistory();
})();
</script>
</body>
</html>
